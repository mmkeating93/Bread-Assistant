       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan Bread Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5F1E8;
            --wheat: #D4A574;
            --crust: #8B6F47;
            --deep-brown: #4A3728;
            --accent: #C17347;
            --shadow: rgba(74, 55, 40, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Karla', sans-serif;
            background: linear-gradient(135deg, #F5F1E8 0%, #E8DCC8 100%);
            color: var(--deep-brown);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 165, 116, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(193, 115, 71, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 300;
            color: var(--deep-brown);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--crust);
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 1px solid rgba(212, 165, 116, 0.2);
            animation: fadeInUp 0.8s ease-out;
            animation-fill-mode: both;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--crust);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--wheat);
            padding-bottom: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--crust);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1.1rem;
            font-family: 'Karla', sans-serif;
            border: 2px solid var(--wheat);
            border-radius: 8px;
            background: var(--cream);
            color: var(--deep-brown);
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(193, 115, 71, 0.1);
            transform: translateY(-2px);
        }

        .results {
            display: grid;
            gap: 1rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: linear-gradient(135deg, var(--cream) 0%, rgba(212, 165, 116, 0.1) 100%);
            border-radius: 8px;
            border-left: 4px solid var(--wheat);
            transition: all 0.3s ease;
        }

        .result-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .result-label {
            font-weight: 500;
            color: var(--crust);
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--deep-brown);
        }

        .timers-section {
            grid-column: 1 / -1;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .timer {
            background: linear-gradient(135deg, white 0%, var(--cream) 100%);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .timer:hover {
            border-color: var(--wheat);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .timer.active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--crust) 100%);
            color: white;
            border-color: var(--deep-brown);
        }

        .timer-name {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .timer.active .timer-name {
            opacity: 1;
        }

        .timer-display {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .timer-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 0.75rem;
        }

        button {
            padding: 0.5rem 1rem;
            font-family: 'Karla', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start {
            background: var(--accent);
            color: white;
        }

        .btn-start:hover {
            background: var(--crust);
            transform: scale(1.05);
        }

        .btn-pause {
            background: var(--wheat);
            color: var(--deep-brown);
        }

        .btn-pause:hover {
            background: var(--crust);
            color: white;
        }

        .btn-reset {
            background: transparent;
            color: var(--crust);
            border: 1px solid var(--wheat);
        }

        .btn-reset:hover {
            background: var(--wheat);
            color: var(--deep-brown);
        }

        .timer.active .btn-start,
        .timer.active .btn-pause,
        .timer.active .btn-reset {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-color: white;
        }

        .timer.active .btn-start:hover,
        .timer.active .btn-pause:hover,
        .timer.active .btn-reset:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem;
            color: var(--crust);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .timer.active {
            animation: pulse 2s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }

            .timer-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
        }

        .notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--deep-brown);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.5s ease-out;
            display: none;
        }

        .notification.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .units {
            color: var(--crust);
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>
    
    <div class="container">
        <header>
            <h1>Artisan Bread</h1>
            <div class="subtitle">Calculator & Timer</div>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2 class="card-title">Leaven Amount</h2>
                <div class="input-group">
                    <label for="leaven">Enter Your Leaven (grams)</label>
                    <input type="number" id="leaven" placeholder="e.g., 200" min="0" step="1">
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">Your Recipe</h2>
                <div class="results" id="results">
                    <div class="result-item">
                        <span class="result-label">Water</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Flour</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Salt</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Total Dough</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                </div>
            </div>

            <div class="card timers-section">
                <h2 class="card-title">Baking Process Timers</h2>
                <div class="timer-grid">
                    <div class="timer" data-timer="firstMix">
                        <div class="timer-name">First Mix</div>
                        <div class="timer-display">10:00</div>
                        <div class="timer-controls">
                            <button class="btn-start" onclick="toggleTimer('firstMix')">Start</button>
                        </div>
                    </div>

                    <div class="timer" data-timer="secondMix">
                        <div class="timer-name">Second Mix</div>
                        <div class="timer-display">20:00</div>
                        <div class="timer-controls">
                            <button class="btn-start" onclick="toggleTimer('secondMix')">Start</button>
                        </div>
                    </div>

                    <div class="timer" data-timer="thirdMix">
                        <div class="timer-name">Third Mix/Shape</div>
                        <div class="timer-display">30:00</div>
                        <div class="timer-controls">
                            <button class="btn-start" onclick="toggleTimer('thirdMix')">Start</button>
                        </div>
                    </div>

                    <div class="timer" data-timer="bulkRise">
                        <div class="timer-name">Bulk Rise</div>
                        <div class="timer-display">4:00:00</div>
                        <div class="timer-controls">
                            <button class="btn-start" onclick="toggleTimer('bulkRise')">Start</button>
                        </div>
                    </div>

                    <div class="timer" data-timer="shapeRise">
                        <div class="timer-name">Shape/Rise</div>
                        <div class="timer-display">2:00:00</div>
                        <div class="timer-controls">
                            <button class="btn-start" onclick="toggleTimer('shapeRise')">Start</button>
                        </div>
                    </div>

                    <div class="timer" data-timer="bake">
                        <div class="timer-name">Bake</div>
                        <div class="timer-display">45:00</div>
                        <div class="timer-controls">
                            <button class="btn-start" onclick="toggleTimer('bake')">Start</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            Made with 🍞 for bakers everywhere
        </div>
    </div>

    <script>
        // Bread calculator logic
        const leavenInput = document.getElementById('leaven');
        const results = document.querySelectorAll('.result-value');

        leavenInput.addEventListener('input', calculateRecipe);

        function calculateRecipe() {
            const leaven = parseFloat(leavenInput.value) || 0;
            
            // Simple ratios:
            // Flour = leaven * 5
            // Water = flour * 0.75
            // Salt = flour * 0.02
            
            const flour = leaven * 5;
            const water = flour * 0.75;
            const salt = flour * 0.02;
            
            const totalDough = leaven + flour + water + salt;
            
            // Update display
            results[0].innerHTML = `${Math.round(water)}<span class="units">g</span>`;
            results[1].innerHTML = `${Math.round(flour)}<span class="units">g</span>`;
            results[2].innerHTML = `${Math.round(salt)}<span class="units">g</span>`;
            results[3].innerHTML = `${Math.round(totalDough)}<span class="units">g</span>`;
        }

        // Timer logic
        const timers = {
            firstMix: { duration: 10 * 60, remaining: 10 * 60, interval: null, running: false },
            secondMix: { duration: 20 * 60, remaining: 20 * 60, interval: null, running: false },
            thirdMix: { duration: 30 * 60, remaining: 30 * 60, interval: null, running: false },
            bulkRise: { duration: 4 * 60 * 60, remaining: 4 * 60 * 60, interval: null, running: false },
            shapeRise: { duration: 2 * 60 * 60, remaining: 2 * 60 * 60, interval: null, running: false },
            bake: { duration: 45 * 60, remaining: 45 * 60, interval: null, running: false }
        };

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay(timerName) {
            const timerElement = document.querySelector(`[data-timer="${timerName}"]`);
            const display = timerElement.querySelector('.timer-display');
            display.textContent = formatTime(timers[timerName].remaining);
        }

        function toggleTimer(timerName) {
            const timer = timers[timerName];
            const timerElement = document.querySelector(`[data-timer="${timerName}"]`);
            const button = timerElement.querySelector('.btn-start');
            
            if (timer.running) {
                // Pause the timer
                timer.running = false;
                timerElement.classList.remove('active');
                button.textContent = 'Start';
                
                if (timer.interval) {
                    clearInterval(timer.interval);
                    timer.interval = null;
                }
            } else {
                // Start the timer
                timer.running = true;
                timerElement.classList.add('active');
                button.textContent = 'Pause';
                
                timer.interval = setInterval(() => {
                    timer.remaining--;
                    updateDisplay(timerName);
                    
                    if (timer.remaining <= 0) {
                        timer.running = false;
                        timerElement.classList.remove('active');
                        button.textContent = 'Start';
                        
                        clearInterval(timer.interval);
                        timer.interval = null;
                        timer.remaining = timer.duration;
                        updateDisplay(timerName);
                        
                        showNotification(`${timerElement.querySelector('.timer-name').textContent} complete!`);
                        playSound();
                    }
                }, 1000);
            }
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        function playSound() {
            // Create a simple beep sound using Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Initialize displays
        Object.keys(timers).forEach(updateDisplay);
    </script>
</body>
</html>
