<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan Bread Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5F1E8;
            --wheat: #D4A574;
            --crust: #8B6F47;
            --deep-brown: #4A3728;
            --accent: #C17347;
            --shadow: rgba(74, 55, 40, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Karla', sans-serif;
            background: linear-gradient(135deg, #F5F1E8 0%, #E8DCC8 100%);
            color: var(--deep-brown);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 165, 116, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(193, 115, 71, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 300;
            color: var(--deep-brown);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--crust);
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px var(--shadow);
            border: 1px solid rgba(212, 165, 116, 0.2);
            animation: fadeInUp 0.8s ease-out;
            animation-fill-mode: both;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--crust);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--wheat);
            padding-bottom: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--crust);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1.1rem;
            font-family: 'Karla', sans-serif;
            border: 2px solid var(--wheat);
            border-radius: 8px;
            background: var(--cream);
            color: var(--deep-brown);
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(193, 115, 71, 0.1);
            transform: translateY(-2px);
        }

        textarea {
            width: 100%;
            min-height: 250px;
            padding: 1rem;
            font-size: 1rem;
            font-family: 'Karla', sans-serif;
            line-height: 1.6;
            border: 2px solid var(--wheat);
            border-radius: 8px;
            background: var(--cream);
            color: var(--deep-brown);
            transition: all 0.3s ease;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(193, 115, 71, 0.1);
        }

        .results {
            display: grid;
            gap: 1rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: linear-gradient(135deg, var(--cream) 0%, rgba(212, 165, 116, 0.1) 100%);
            border-radius: 8px;
            border-left: 4px solid var(--wheat);
            transition: all 0.3s ease;
        }

        .result-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .result-label {
            font-weight: 500;
            color: var(--crust);
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--deep-brown);
        }

        .timers-section {
            grid-column: 1 / -1;
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem;
            color: var(--crust);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }
        }

        .units {
            color: var(--crust);
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Artisan Bread</h1>
            <div class="subtitle">Calculator & Timer</div>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2 class="card-title">Leaven Amount</h2>
                <div class="input-group">
                    <label for="leaven">Enter Your Leaven (grams)</label>
                    <input type="number" id="leaven" placeholder="e.g., 200" min="0" step="1">
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">Your Recipe</h2>
                <div class="results" id="results">
                    <div class="result-item">
                        <span class="result-label">Water</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Flour</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Salt</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Total Dough</span>
                        <span class="result-value">0<span class="units">g</span></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">Nutrition</h2>
                <div class="input-group">
                    <label for="flourCalories">Flour Calories per 30g</label>
                    <input type="number" id="flourCalories" placeholder="e.g., 110" min="0" step="1" value="110">
                </div>
                <div class="results">
                    <div class="result-item">
                        <span class="result-label">Total Calories</span>
                        <span class="result-value" id="totalCalories">0<span class="units">kcal</span></span>
                    </div>
                </div>
            </div>

            <div class="card timers-section">
                <h2 class="card-title">Baking Instructions</h2>
                <div class="input-group">
                    <label for="instructions">Your Recipe Notes</label>
                    <textarea id="instructions" placeholder="Add your baking instructions here...">1) Pull leaven out of fridge (feed if flat or has liquid layer on top)
2) Weigh leaven, add water and flour, mix until just combined (1-2 min)
3) Feed starter and put back into fridge
4) Rest 30 min (autolyse)
5) Add salt, mix on speed 2 for 4-5 min (dough will clean bowl sides and look smooth)
6) Bulk proof 4-5 hours at room temp - completely untouched!
7) Shape (gentle letter fold while shaping)
8) Cold proof 12-24 hours in fridge
9) Preheat oven to 450°F with Dutch oven inside for 30-45 min
10) Score dough, carefully transfer to hot Dutch oven (use parchment paper)
11) Bake covered 20-30 min (depending on size)
12) Remove lid, bake uncovered 10-25 min until deep golden brown</textarea>
                </div>
            </div>
        </div>

        <div class="footer">
            Made with 🍞 for bakers everywhere
        </div>
    </div>

    <script>
        // Bread calculator logic
        const leavenInput = document.getElementById('leaven');
        const flourCaloriesInput = document.getElementById('flourCalories');
        const results = document.querySelectorAll('.result-value');

        leavenInput.addEventListener('input', calculateRecipe);
        flourCaloriesInput.addEventListener('input', calculateRecipe);

        function calculateRecipe() {
            const leaven = parseFloat(leavenInput.value) || 0;
            const flourCaloriesPer30g = parseFloat(flourCaloriesInput.value) || 110;
            
            // Simple ratios:
            // Flour = leaven * 5
            // Water = flour * 0.75
            // Salt = flour * 0.02
            
            const flour = leaven * 5;
            const water = flour * 0.75;
            const salt = flour * 0.02;
            
            const totalDough = leaven + flour + water + salt;
            
            // Calculate calories
            // Starter is 50% flour, so starter flour = leaven * 0.5
            // Total flour in recipe = flour (from calculation above)
            // This already includes the flour from the starter since flour = leaven * 5
            // and if starter is 50% flour, then starter flour = leaven * 0.5
            // which means additional flour = flour - (leaven * 0.5)
            
            // Total flour in entire recipe (including what's in the starter)
            const totalFlourInRecipe = flour;
            
            // Calculate calories from flour
            const caloriesPer1g = flourCaloriesPer30g / 30;
            const totalCalories = totalFlourInRecipe * caloriesPer1g;
            
            // Update display
            results[0].innerHTML = `${Math.round(water)}<span class="units">g</span>`;
            results[1].innerHTML = `${Math.round(flour)}<span class="units">g</span>`;
            results[2].innerHTML = `${Math.round(salt)}<span class="units">g</span>`;
            results[3].innerHTML = `${Math.round(totalDough)}<span class="units">g</span>`;
            
            // Update calorie display
            document.getElementById('totalCalories').innerHTML = `${Math.round(totalCalories)}<span class="units">kcal</span>`;
        }

        // Initialize with default calorie value
        calculateRecipe();
    </script>
</body>
</html>
